name: yatrawalk
description: A Spiritual Walking Journey App

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  http: ^1.2.2
  cupertino_icons: ^1.0.8

  # Maps
  google_maps_flutter: ^2.12.3
  geolocator: ^14.0.2

  # Step Counter
  pedometer: ^4.1.1
  permission_handler: ^12.0.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true